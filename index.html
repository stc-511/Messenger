<!doctype html>
<html lang=en>

<head>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js?v=1"></script>
	<script src=https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js></script>
	<meta charset=UTF-8>
	<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
	<title>Home - Classroom</title>
	<link rel=icon href="https://upload.wikimedia.org/wikipedia/commons/5/59/Google_Classroom_Logo.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" type=image/svg+xml>
	<link rel="stylesheet" href="style.css"> </head>

<body>
	<div class=app-container>
		<div id=customNotif onclick='this.style.display="none"'><strong>New Message:</strong><span id=notifSender></span>
			<br><span id=notifBody></span></div>
		<div class=technical-header>
			<div class=tech-row><span>YOU: <input id=myIdInput value=B0></span><span style=color:#0f0>● ONLINE</span></div>
			<div class=tech-row><span>POLL: 3000ms</span><span>STABLE MODE</span></div>
		</div>
		<div id=messagesLog></div>
		<div class=input-tray>
			<input id=receiverInput class=receiver-chip value=B1>
			<input id=msgInput placeholder=Message...>
			<button class=send-circle onclick=sendFromUI()>↑ </button>
			<button class=send-circle style=background:#444;font-size:.7em;margin-left:5px onclick=clearChat()>CL </button>
			<button class=send-circle style=background:#d9534f;font-size:.7em;margin-left:5px onclick=signOut()>SO </button>
		</div>
	</div>
	<script src="main.js"></script>
</body>

</html>
